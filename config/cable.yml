# Development uses solid_cable rather than the async adapter because jobs run in
# a separate Solid Queue process (see Procfile.dev). An in-process adapter would
# broadcast progress into the worker's own memory and the browser would never
# see it. It also means `bin/rails console` can broadcast to an open page.
development:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day

test:
  adapter: test

production:
  adapter: solid_cable
  connects_to:
    database:
      writing: cable
  polling_interval: 0.1.seconds
  message_retention: 1.day
