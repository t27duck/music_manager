# Builds every package for a `v*` tag and attaches them to a draft GitHub Release, which is
# published by hand after reviewing the notes. Bump the version first: `make bump VERSION=X.Y.Z`.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version in every file
        run: scripts/version.sh check "${GITHUB_REF_NAME#v}"

  deb:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-deb
          path: src-tauri/target/release/bundle/deb/*.deb

  # Same container and PKGBUILD as `make arch`; makepkg's check() runs the Rust tests.
  arch:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: make image-arch arch

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-arch
          path: dist/*.pkg.tar.zst

  macos:
    needs: version
    uses: ./.github/workflows/macos.yml

  windows:
    needs: version
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [deb, arch, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Artifacts lose the executable bit, so the macOS binary is tarred to keep it.
      - name: Assemble release files
        run: |
          ver=${GITHUB_REF_NAME#v}
          mkdir release
          cp artifacts/music-manager-deb/*.deb artifacts/music-manager-arch/*.pkg.tar.zst \
            artifacts/music-manager-windows-x64/*.exe release/
          chmod +x artifacts/music-manager-macos-arm64/music-manager
          tar -czf "release/MusicManager_${ver}_macos-arm64.tar.gz" \
            -C artifacts/music-manager-macos-arm64 music-manager
          mv artifacts/music-manager-windows-x64-portable artifacts/MusicManager
          (cd artifacts && zip -r "../release/MusicManager_${ver}_x64-portable.zip" MusicManager)
          (cd release && sha256sum -- * > SHA256SUMS)
          ls -l release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --verify-tag \
            --title "MusicManager ${GITHUB_REF_NAME#v}" --generate-notes
