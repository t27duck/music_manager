# Unsigned x64 NSIS installer. SmartScreen warns on first run: More info → Run anyway.
# The installer fetches WebView2 if it's missing (it ships with Windows 11 and current Windows 10).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --bundles nsis

      # NTFS paths use backslashes and are case-insensitive; run the tests there too.
      - run: cargo test
        working-directory: src-tauri

      - uses: actions/upload-artifact@v4
        with:
          name: music-manager-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
