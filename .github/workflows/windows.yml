# Unsigned x64 NSIS installer, plus a portable folder (the exe and a data\ folder that keeps
# settings and the index beside it). SmartScreen warns on first run: More info → Run anyway.
# The installer fetches WebView2 if it's missing; the portable build needs it already installed
# (it ships with Windows 11 and current Windows 10).
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --bundles nsis

      # NTFS paths use backslashes and are case-insensitive; run the tests there too.
      - run: cargo test
        working-directory: src-tauri

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe

      # upload-artifact skips empty folders, so data\ gets a note explaining it.
      - name: Assemble the portable folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable/data | Out-Null
          Copy-Item src-tauri/target/release/music-manager.exe portable/
          Set-Content portable/data/README.txt @(
            "MusicManager keeps its settings, library index and browser storage in this folder"
            "because it sits next to music-manager.exe. Delete the folder to use the user profile instead."
          )

      - uses: actions/upload-artifact@v7
        with:
          name: music-manager-windows-x64-portable
          path: portable/
