[package]
name = "music-manager"
version = "0.1.0"
description = "Local MP3 library manager"
authors = ["Tony Drake"]
edition = "2021"

[lib]
name = "music_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "music-manager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
dirs = "7.0.0"
id3 = "1.17.2"
lofty = "0.25.4"
notify-debouncer-mini = "0.7.0"
rayon = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-dialog = "2.7.3"
walkdir = "2.5.0"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
